load_from: null


data:
  _target_: "dataset.comp_image_dataset.CompositionImageDataset"
  params:
    root: "/home/ubuntu/sdb/CZSL/cgqa"
    split: "compositional-split-natural"

model:
  _target_: "modules.model1.MCR2CVL"
  params:
    emb_dim: 300
    feat_dim: 768
    num_heads: 24
    num_latents: 128
    num_layers: 6
    eta: 0.1
    feat_extractor: "clip"
    emb_init: "clip"
    static_inp: False
    train_only: True  # closed-world
    is_image: True
    lambda_flow: 0.1
