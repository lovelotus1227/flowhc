    lambda_hyper_comp: 0.05
    lambda_hyper_contrast: 0.0
    composer_type: "gated"
    composer_hidden_dim: null
    composer_dropout: 0.1

train:
  batch_size: 64
  warmup: 3
  epochs: 50
  com_lr: 0.00025
  com_wd: 0.00005
  ve_lr: 0.0002
  ve_wd: 0.00005
  cosine_scale: 100
  eval_freq: 5
  eval_ts: 45
